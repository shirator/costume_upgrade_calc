<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArcheAge Costume Craft Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0c11;
    --bg-soft: #10131a;
    --panel: #141821;
    --panel-line: #262c3a;
    --text: #e9ebf2;
    --text-dim: #8891a3;
    --text-faint: #545c6f;
    --ember: #e8b04b;
    --ember-soft: #332a17;
    --crystal: #6ee7d8;
    --crystal-soft: #163330;
    --gold: #d9c087;
    --radius: 3px;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, #182534 0%, transparent 60%),
      radial-gradient(ellipse 700px 400px at 100% 10%, #1a2b2a 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    padding: 48px 20px 80px;
  }

  .wrap{ max-width: 880px; margin: 0 auto; }

  header{ margin-bottom: 40px; }
  h1{
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: 40px;
    line-height: 1.1;
    margin: 0 0 14px;
    color: var(--text);
  }

  /* ---- settings bar ---- */
  .settings{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--panel-line);
    border: 1px solid var(--panel-line);
    border-radius: var(--radius);
    margin: 36px 0 28px;
    overflow: hidden;
  }
  .setting{
    background: var(--panel);
    padding: 14px 16px;
  }
  .setting label{
    display:block;
    font-size: 11.5px;
    color: var(--text-faint);
    margin-bottom: 6px;
  }
  .setting .field{
    display:flex;
    align-items: baseline;
    gap: 4px;
  }
  .setting .field span{ color: var(--text-faint); font-size: 13px; }
  .setting input{
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 600;
    padding: 0;
  }
  .setting input:focus{ outline: none; }
  .setting input::-webkit-outer-spin-button,
  .setting input::-webkit-inner-spin-button{ -webkit-appearance: none; margin:0; }

  /* ---- target row ---- */
  .target-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .target-controls{
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .target-controls .label{
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  select.tier-select{
    background: var(--panel);
    border: 1px solid var(--panel-line);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 9px 12px;
    border-radius: var(--radius);
  }

  .legend{
    display:flex;
    gap: 18px;
    font-size: 12.5px;
    color: var(--text-faint);
  }
  .legend .dot{
    display:inline-block;
    width:8px; height:8px;
    border-radius: 50%;
    margin-right: 6px;
    position: relative;
    top: -1px;
  }
  .dot.ember{ background: var(--ember); }
  .dot.crystal{ background: var(--crystal); }

  /* ---- tier list ---- */
  .tiers{
    border-top: 1px solid var(--panel-line);
  }
  .tier{
    display: grid;
    grid-template-columns: 32px 1.5fr 130px 1fr 1fr;
    align-items: center;
    gap: 14px;
    padding: 16px 4px;
    border-bottom: 1px solid var(--panel-line);
    transition: opacity .15s ease;
  }
  .tier.excluded{ opacity: .32; }

  .tier .step{
    font-family: 'Fraunces', serif;
    font-size: 15px;
    color: var(--text-faint);
  }

  .tier .name-col .grade{
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 600;
  }
  .tier .name-col .stones{
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 2px;
  }
  .tier .name-col .stones b{ color: var(--text-dim); font-weight: 600; }

  .toggle-col{ display:flex; justify-content: flex-start; }
  .toggle{
    position: relative;
    width: 132px;
    height: 30px;
    background: var(--bg-soft);
    border: 1px solid var(--panel-line);
    border-radius: 999px;
    cursor: pointer;
    display: flex;
    align-items: center;
    padding: 2px;
    user-select: none;
  }
  .toggle.disabled{ cursor: default; opacity: .35; }
  .toggle .pill{
    position: absolute;
    top: 2px; bottom: 2px;
    width: 64px;
    border-radius: 999px;
    background: var(--ember-soft);
    transition: transform .18s ease, background .18s ease;
  }
  .toggle.bound .pill{
    transform: translateX(64px);
    background: var(--crystal-soft);
  }
  .toggle .opt{
    position: relative;
    z-index: 1;
    width: 50%;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
  }
  .toggle .opt.unbound{ color: var(--ember); }
  .toggle .opt.bound-lbl{ color: var(--text-faint); }
  .toggle.bound .opt.unbound{ color: var(--text-faint); }
  .toggle.bound .opt.bound-lbl{ color: var(--crystal); }

  .num-col{ text-align: right; }
  .num-col .amt{
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .num-col .unit{
    font-size: 11px;
    color: var(--text-faint);
    margin-top: 2px;
  }

  .num-col.cost.unbound-cost .amt{ color: var(--gold); }
  .num-col.cost.bound-cost .amt{ color: var(--gold); }

  .num-col.charcoal .amt{ color: var(--ember); }

  /* ---- summary ---- */
  .summary{
    margin-top: 32px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: var(--radius);
    padding: 24px 26px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 24px;
  }
  .summary .stat .val{
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .summary .stat.gold .val{ color: var(--gold); }
  .summary .stat.charcoal .val{ color: var(--ember); }
  .summary .stat.tokens .val{ color: var(--crystal); }
  .summary .stat .lbl{
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 4px;
  }

  @media (max-width: 640px){
    .settings{ grid-template-columns: repeat(2,1fr); }
    .tier{
      grid-template-columns: 24px 1fr;
      grid-template-areas:
        "step name"
        ".    toggle"
        ".    nums";
      row-gap: 10px;
    }
    .tier .step{ grid-area: step; }
    .tier .name-col{ grid-area: name; }
    .toggle-col{ grid-area: toggle; }
    .tier .num-col{ text-align: left; }
    .summary{ grid-template-columns: repeat(2,1fr); }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>ArcheAge Costume Craft Calculator</h1>
  </header>

  <div class="settings">
    <div class="setting">
      <label for="priceCharcoal">Charcoal price</label>
      <div class="field"><span>g</span><input type="number" id="priceCharcoal" value="1.55" step="0.01" min="0"></div>
    </div>
    <div class="setting">
      <label for="priceMisagon">Misagon's Crystal</label>
      <div class="field"><span>g</span><input type="number" id="priceMisagon" value="35" step="0.5" min="0"></div>
    </div>
    <div class="setting">
      <label for="priceClear">Clear Stone price</label>
      <div class="field"><span>g</span><input type="number" id="priceClear" value="1.76" step="0.01" min="0"></div>
    </div>
    <div class="setting">
      <label for="priceTable">Crafting table fee</label>
      <div class="field"><span>g</span><input type="number" id="priceTable" value="9" step="0.5" min="0"></div>
    </div>
  </div>

  <div class="target-row">
    <div class="target-controls">
      <div class="label">
        Upgrade from
        <select id="startTier" class="tier-select"></select>
      </div>
      <div class="label">
        to
        <select id="targetTier" class="tier-select"></select>
      </div>
    </div>
    <div class="legend">
      <span><span class="dot ember"></span>Unbound</span>
      <span><span class="dot crystal"></span>Bound</span>
    </div>
  </div>

  <div class="tiers" id="tierList"></div>

  <div class="summary">
    <div class="stat gold">
      <div class="val" id="sumGold">—</div>
      <div class="lbl">Total gold</div>
    </div>
    <div class="stat charcoal">
      <div class="val" id="sumCharcoal">—</div>
      <div class="lbl">Charcoal used</div>
    </div>
    <div class="stat misagon">
      <div class="val" id="sumMisagon">—</div>
      <div class="lbl">Misagon used</div>
    </div>
    <div class="stat tokens">
      <div class="val" id="sumTokens">—</div>
      <div class="lbl">Activity tokens used</div>
    </div>
    <div class="stat">
      <div class="val" id="sumStones">—</div>
      <div class="lbl">Synthium stones crafted</div>
    </div>
  </div>
</div>

<script>
  const BASE_GRADES = [
    { name: 'Basic (0%)', color: '#999999' },
    { name: 'Grand',      color: '#55b255' },
    { name: 'Rare',       color: '#3083e5' },
    { name: 'Arcane',     color: '#ad52d6' },
    { name: 'Heroic',     color: '#e69214' },
    { name: 'Unique',     color: '#f06433' },
    { name: 'Celestial',  color: '#ee3c3c' },
    { name: 'Divine',     color: '#d66e43' },
    { name: 'Epic',       color: '#8ba6c1' },
    { name: 'Legendary',  color: '#e69600' },
    { name: 'Mythic',     color: '#e61d1d' },
  ];

  const TIERS = [
    { name: 'Grand',        stones: 4,  type: 'Clear',   color: '#55b255' },
    { name: 'Rare',         stones: 8,  type: 'Clear',   color: '#3083e5' },
    { name: 'Arcane',       stones: 12, type: 'Vivid',   color: '#ad52d6' },
    { name: 'Heroic',       stones: 16, type: 'Vivid',   color: '#e69214' },
    { name: 'Unique',       stones: 20, type: 'Lucid',   color: '#f06433' },
    { name: 'Celestial',    stones: 24, type: 'Lucid',   color: '#ee3c3c' },
    { name: 'Divine',       stones: 28, type: 'Lucid',   color: '#d66e43' },
    { name: 'Epic',         stones: 32, type: 'Lucid',   color: '#8ba6c1' },
    { name: 'Legendary',    stones: 36, type: 'Radiant', color: '#e69600' },
    { name: 'Mythic',       stones: 40, type: 'Radiant', color: '#e61d1d' },
    { name: 'Mythic 100%',  stones: 44, type: 'Radiant', color: '#e61d1d' },
  ];

  const CHARCOAL_TRADE = 20;
  const CHARCOAL_BOUND = 5;
  const TOKENS_BOUND = 5;

  const state = {
    mode: TIERS.map(t => t.type !== 'Clear'), // true = bound, false = unbound
    start: 0,
    target: TIERS.length - 1,
  };

  const $ = id => document.getElementById(id);

  function prices(){
    return {
      charcoal: parseFloat($('priceCharcoal').value) || 0,
      misagon: parseFloat($('priceMisagon').value) || 0,
      clear: parseFloat($('priceClear').value) || 0,
      table: parseFloat($('priceTable').value) || 0,
    };
  }

  function misagonPerStone(type) {
    if (type === 'Lucid') return 1;
    if (type === 'Radiant') return 3;
    return 0;
  }

  function stonePrice(type, bound, p){
    const c = bound ? CHARCOAL_BOUND : CHARCOAL_TRADE;
    if (type === 'Clear') return p.clear;
    if (type === 'Vivid') return p.clear + p.table + c * p.charcoal;
    if (type === 'Lucid') return stonePrice('Vivid', bound, p) + p.misagon + p.table + c * p.charcoal;
    if (type === 'Radiant') return stonePrice('Lucid', bound, p) + 2 * p.misagon + p.table + c * p.charcoal;
  }

  function fmt(n, decimals=2){
    return n.toLocaleString(undefined, { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }
  function fmtInt(n){
    return Math.round(n).toLocaleString();
  }

  function buildTierOptions(){
    const startSel = $('startTier');
    const targetSel = $('targetTier');
    
    startSel.innerHTML = '';
    targetSel.innerHTML = '';

    BASE_GRADES.forEach((g, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = g.name;
      opt.style.color = g.color;
      if (i === state.start) opt.selected = true;
      startSel.appendChild(opt);
    });

    TIERS.forEach((t, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = t.name;
      opt.style.color = t.color;
      if (i === state.target) opt.selected = true;
      targetSel.appendChild(opt);
    });

    startSel.addEventListener('change', () => {
      state.start = parseInt(startSel.value, 10);
      if (state.start > state.target) {
        state.target = Math.min(state.start, TIERS.length - 1);
        targetSel.value = state.target;
      }
      render();
    });

    targetSel.addEventListener('change', () => {
      state.target = parseInt(targetSel.value, 10);
      if (state.target < state.start) {
        state.start = state.target;
        startSel.value = state.start;
      }
      render();
    });
  }

  function render(){
    const p = prices();
    const list = $('tierList');
    list.innerHTML = '';

    let totalGold = 0, totalCharcoal = 0, totalTokens = 0, totalStones = 0, totalMisagon = 0;

    TIERS.forEach((t, i) => {
      const included = i >= state.start && i <= state.target;
      const usesCharcoal = t.type !== 'Clear';
      const isBound = state.mode[i];

      const price = stonePrice(t.type, isBound, p);
      const tierGold = t.stones * price;
      const tierCharcoal = usesCharcoal ? t.stones * (isBound ? CHARCOAL_BOUND : CHARCOAL_TRADE) : 0;
      const tierTokens = usesCharcoal && isBound ? t.stones * TOKENS_BOUND : 0;
      const tierMisagon = t.stones * misagonPerStone(t.type);

      if (included){
        totalGold += tierGold;
        totalCharcoal += tierCharcoal;
        totalTokens += tierTokens;
        totalStones += t.stones;
        totalMisagon += tierMisagon;
      }

      const row = document.createElement('div');
      row.className = 'tier' + (included ? '' : ' excluded');

      row.innerHTML = `
        <div class="step">${String(i+1).padStart(2,'0')}</div>
        <div class="name-col">
          <div class="grade" style="color: ${t.color}">${t.name}</div>
          <div class="stones"><b>${t.stones}</b> ${t.type} Stone${t.stones>1?'s':''}</div>
        </div>
        <div class="toggle-col">
          <div class="toggle ${isBound ? 'bound' : ''} ${usesCharcoal ? '' : 'disabled'}" data-idx="${i}" title="${usesCharcoal ? 'Click to switch Synthium source' : 'Clear Stones need no charcoal'}">
            <div class="pill"></div>
            <div class="opt unbound">Unbound</div>
            <div class="opt bound-lbl">Bound</div>
          </div>
        </div>
        <div class="num-col cost ${isBound ? 'bound-cost' : 'unbound-cost'}">
          <div class="amt">${fmt(tierGold, 1)}g</div>
          <div class="unit">tier cost</div>
        </div>
        <div class="num-col charcoal">
          <div class="amt">${usesCharcoal ? fmtInt(tierCharcoal) : '—'}</div>
          <div class="unit">charcoal</div>
        </div>
      `;

      list.appendChild(row);

      if (usesCharcoal){
        const toggleEl = row.querySelector('.toggle');
        toggleEl.addEventListener('click', () => {
          state.mode[i] = !state.mode[i];
          render();
        });
      }
    });

    $('sumGold').textContent = fmt(totalGold, 0) + 'g';
    $('sumCharcoal').textContent = fmtInt(totalCharcoal);
    $('sumTokens').textContent = fmtInt(totalTokens);
    $('sumStones').textContent = fmtInt(totalStones);
    $('sumMisagon').textContent = fmtInt(totalMisagon);
  }

  ['priceCharcoal','priceMisagon','priceClear','priceTable'].forEach(id => {
    $(id).addEventListener('input', render);
  });

  buildTierOptions();
  render();
</script>
</body>
</html>
